services:
  postgres:
    image: postgres:16-alpine
    container_name: ipp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipp
      POSTGRES_PASSWORD: ipp_dev_password
      POSTGRES_DB: ipp_dev
    ports:
      - "5432:5432"
    volumes:
      - ipp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipp -d ipp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ipp_pg_data:
